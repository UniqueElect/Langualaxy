spring:
  config:
    import: optional:file:.env[.properties]

  # Hibernate ddl-auto(create, create-drop, validate, update)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true

  # Database
  datasource:
    url: ${DB_URL}
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

langualaxy:
  tests:
    questions-per-attempt: 10

